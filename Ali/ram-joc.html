<style>
:root{--pcb:#0e2a1b;--pcb2:#14402a;--gold:#e3b94c;--paper:#f2f5ee;--bad:#ff7b6b}
body{background:var(--pcb);color:var(--paper);font-family:'Bricolage Grotesque',system-ui,sans-serif}
h1,h2,h3{font-weight:800;letter-spacing:-.02em}
.panel{background:var(--pcb2);border:1px solid rgba(227,185,76,.25);border-radius:.5rem;padding:1.25rem}
.gold{color:var(--gold)}
.board{position:relative;background:#fff;border-radius:.5rem;overflow:hidden;cursor:crosshair;user-select:none}
.board img{width:100%;display:block}
.spot{position:absolute;width:9%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);border:2px solid transparent;padding:0;background:transparent}
.spot.ok{border-color:#1f9d55;background:rgba(31,157,85,.3)}
.spot.ko{border-color:var(--bad);background:rgba(255,123,107,.35)}
.hit{position:absolute;inset:0}
.btn-gold{background:var(--gold);color:#1b1500;font-weight:700;border:0}
.btn-gold:hover{background:#f0cb68;color:#1b1500}
.target{font-size:1.6rem}
.stat{font-variant-numeric:tabular-nums}
.progress{background:rgba(255,255,255,.12)}
.progress-bar{background:var(--gold)}
canvas{max-height:240px}
</style>

  {id:'h1',t:'forat',x:7.3,y:81},{id:'h2',t:'forat',x:97.2,y:40}
];
const rounds = [
  {q:'Troba un xip de memòria',ok:s=>s.t==='xip'},
  {q:'Troba els contactes daurats',ok:s=>s.t==='contactes'},
  {q:'Troba l\'osca de posició',ok:s=>s.t==='osca'},
  {q:'Troba un forat de fixació',ok:s=>s.t==='forat'},
  {q:'Troba el xip de l\'extrem dret',ok:s=>s.id==='c8'}
];
const board=document.getElementById('board');
spots.forEach(s=>{
  const b=document.createElement('button');
  b.className='spot';b.style.left=s.x+'%';b.style.top=s.y+'%';b.dataset.id=s.id;
  b.setAttribute('aria-label',s.t);board.appendChild(b);
});
const el=id=>document.getElementById(id);
let r=-1,score=0,hits=0,miss=0,t0=0,timer=null,times=[],active=false;
const pie=new Chart(el('pie'),{type:'doughnut',data:{labels:['Encerts','Errors'],datasets:[{data:[0,0],backgroundColor:['#e3b94c','#ff7b6b'],borderWidth:0}]},options:{plugins:{legend:{labels:{color:'#f2f5ee'}}}}});
const bars=new Chart(el('bars'),{type:'bar',data:{labels:[],datasets:[{data:[],backgroundColor:'#e3b94c'}]},options:{plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#f2f5ee'},grid:{display:false}},y:{ticks:{color:'#f2f5ee'},grid:{color:'rgba(255,255,255,.1)'}}}}});
function refresh(){pie.data.datasets[0].data=[hits,miss];pie.update();bars.data.labels=times.map((_,i)=>'P'+(i+1));bars.data.datasets[0].data=times;bars.update();el('score').textContent=score;}
function next(){
  r++;document.querySelectorAll('.spot').forEach(s=>s.className='spot');
  if(r>=rounds.length){finish();return;}
  el('target').innerHTML='<i class="fa-solid fa-magnifying-glass gold me-2"></i>'+rounds[r].q;
  el('bar').style.width=(r/rounds.length*100)+'%';
  t0=performance.now();
}
function finish(){
  active=false;clearInterval(timer);el('bar').style.width='100%';
  el('target').innerHTML='<i class="fa-solid fa-trophy gold me-2"></i>Final: '+score+' punts';
  el('start').innerHTML='<i class="fa-solid fa-rotate-right me-1"></i>Tornar a jugar';el('start').disabled=false;
  el('msg').textContent=hits+' encerts i '+miss+' errors.';
}
el('start').onclick=()=>{
  r=-1;score=hits=miss=0;times=[];active=true;el('start').disabled=true;el('msg').textContent='';
  clearInterval(timer);const t=performance.now();
  timer=setInterval(()=>el('time').textContent=((performance.now()-t)/1000).toFixed(1),100);
  refresh();next();
};
board.addEventListener('click',e=>{
  if(!active)return;
  const spot=e.target.closest('.spot');
  if(spot&&rounds[r].ok(spots.find(s=>s.id===spot.dataset.id))){
    spot.classList.add('ok');hits++;score+=10;
    times.push(+((performance.now()-t0)/1000).toFixed(1));refresh();
    el('msg').innerHTML='<i class="fa-solid fa-check gold"></i> Correcte!';
    active=false;setTimeout(()=>{active=true;next();},700);
  }else{
    if(spot)spot.classList.add('ko');
    miss++;score=Math.max(0,score-2);refresh();
    el('msg').innerHTML='<i class="fa-solid fa-xmark" style="color:var(--bad)"></i> Torna-ho a provar.';
  }
});
</script>
</body>
</html>
